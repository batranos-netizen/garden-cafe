<!doctype html><meta charset=utf-8><body>enviando...<script>const DATA={".env.example": "# ====== Garden Caf\u00e9 \u00b7 Configuraci\u00f3n ======\n# Direcci\u00f3n p\u00fablica del sitio (la que va en los QR). Sin barra al final.\nBASE_URL=https://tu-app.onrender.com\n\n# Mercado Pago -> Tus integraciones -> Credenciales de PRODUCCI\u00d3N\nMP_ACCESS_TOKEN=APP_USR-xxxxxxxxxxxxxxxx\n# Mercado Pago -> Tus integraciones -> Webhooks -> \"Clave secreta\"\nMP_WEBHOOK_SECRET=\n# Pon\u00e9 1 para probar sin cobrar de verdad\nMP_MOCK=0\n\n# Contrase\u00f1a del panel de cocina (/panel)\nPANEL_PASSWORD=cambiame-por-una-segura\nCANT_MESAS=12\n\n# WhatsApp: callmebot (gratis y simple) | cloud (API oficial de Meta) | vac\u00edo = desactivado\nWHATSAPP_MODO=callmebot\nCALLMEBOT_TELEFONO=+5492200000000\nCALLMEBOT_APIKEY=\n# Solo si WHATSAPP_MODO=cloud\nWA_TOKEN=\nWA_PHONE_ID=\nWA_DESTINO=5492200000000\n\n# Carpeta donde se guardan los pedidos (en Render usar un disco: /var/data)\nDATA_DIR=\n", ".gitignore": "node_modules\n.env\ndata/\n", "INICIAR-GARDEN-CAFE.bat": "@echo off\nchcp 65001 >nul\ntitle Garden Cafe - Sistema de pedidos\ncd /d \"%~dp0\"\nwhere node >nul 2>nul\nif errorlevel 1 (\n  echo.\n  echo  Falta instalar Node.js. Se abre la pagina de descarga:\n  echo  instala la version LTS y despues volve a abrir este archivo.\n  start https://nodejs.org/es\n  pause\n  exit /b\n)\necho.\necho  Iniciando Garden Cafe... NO cierres esta ventana mientras lo uses.\necho.\nstart \"\" /min cmd /c \"timeout /t 3 >nul & start http://localhost:3000/panel & start http://localhost:3000/?mesa=1\"\nnode server.js\npause\n", "README.md": "# Garden Caf\u00e9 \u00b7 Pedidos por QR con Mercado Pago\n\nSistema completo para que tus clientes **escaneen el QR, vean la carta, pidan con el bot y paguen con Mercado Pago**. Cuando el pago queda verificado, el pedido llega solo a la cocina: **panel en pantalla + comanda impresa + WhatsApp**. Funciona para **mesa** y **take away**.\n\n## C\u00f3mo funciona\n\n```\nCliente escanea QR (Mesa 5 / Take away)\n   \u2192 Carta web con promos y precios\n   \u2192 Garden Bot: confirma pedido, mesa o take away, nombre, tel\u00e9fono, horario, aclaraciones\n   \u2192 Bot\u00f3n \"Pagar con Mercado Pago\" (tarjeta, d\u00e9bito, dinero en cuenta)\n   \u2192 Mercado Pago avisa al sistema (webhook firmado)\n   \u2192 El sistema CONSULTA a Mercado Pago que el pago est\u00e9 aprobado y que el monto coincida\n   \u2192 Reci\u00e9n ah\u00ed: n\u00famero de pedido #001 \u2192 Panel de cocina (con sonido) + comanda impresa + WhatsApp\n   \u2192 El cliente ve en su celu: Pagado \u2192 Preparando \u2192 \u00a1Listo!\n```\n\nSeguridad incluida: los precios siempre se calculan en el servidor (nadie puede cambiarlos desde el celu), se verifica la firma de Mercado Pago, un pago nunca se procesa dos veces, y si el monto no coincide el pedido queda marcado \"\u26a0\ufe0f a revisar\" en vez de ir a cocina.\n\n## P\u00e1ginas\n\n| Direcci\u00f3n | Para qui\u00e9n | Qu\u00e9 hace |\n|---|---|---|\n| `/?mesa=5` | Cliente | Carta + bot (el QR de cada mesa ya trae el n\u00famero) |\n| `/?modo=takeaway` | Cliente | Carta + bot para llevar |\n| `/estado?pedido=\u2026` | Cliente | Seguimiento del pedido en vivo |\n| `/panel` | Cocina / mostrador | Pedidos pagados en tiempo real, con contrase\u00f1a |\n| `/qr` | Vos | Genera e imprime los QR de todas las mesas y el de take away |\n\n## Editar la carta\n\nTodo est\u00e1 en **`menu.json`**: nombre, descripci\u00f3n, precio, `precio_anterior` (para mostrar el tachado en promos), `etiqueta` (ej. \"Hasta las 12 hs\") y `disponible` (`false` = aparece \"Sin stock\"). Guard\u00e1s y listo, no hace falta reiniciar.\n\n## Puesta en marcha (unos 20 minutos)\n\n### 1. Credenciales de Mercado Pago\n1. Entr\u00e1 a **mercadopago.com.ar/developers** con tu cuenta vendedora \u2192 **Tus integraciones** \u2192 **Crear aplicaci\u00f3n** (tipo: Pagos online \u00b7 Checkout Pro).\n2. En la aplicaci\u00f3n \u2192 **Credenciales de producci\u00f3n** \u2192 copi\u00e1 el **Access Token** (empieza con `APP_USR-`). No lo compartas con nadie.\n\n### 2. Publicar el sistema (Render)\n1. Sub\u00ed esta carpeta a un repositorio de GitHub (privado).\n2. En **render.com** \u2192 New \u2192 **Blueprint** \u2192 eleg\u00ed el repositorio (usa `render.yaml`, plan Starter con disco para guardar pedidos).\n3. Complet\u00e1 las variables:\n   - `BASE_URL` \u2192 la direcci\u00f3n que te da Render, ej. `https://garden-cafe.onrender.com` (o tu dominio propio)\n   - `MP_ACCESS_TOKEN` \u2192 el token del paso 1\n   - `PANEL_PASSWORD` \u2192 una contrase\u00f1a para la cocina\n   - `CANT_MESAS` \u2192 cu\u00e1ntas mesas ten\u00e9s\n\n> Tambi\u00e9n funciona en Railway, un VPS o una PC del local con Node.js 18+: `node server.js` (no necesita instalar nada m\u00e1s). Copi\u00e1 `.env.example` como `.env` y completalo.\n\n### 3. Activar las notificaciones de pago (webhook)\n1. En tu aplicaci\u00f3n de Mercado Pago \u2192 **Webhooks** \u2192 **Configurar notificaciones**.\n2. URL de producci\u00f3n: `https://TU-DIRECCION/api/webhooks/mercadopago` \u00b7 Evento: **Pagos** \u2192 Guardar.\n3. Copi\u00e1 la **clave secreta** que aparece y pegala en la variable `MP_WEBHOOK_SECRET`.\n\n### 4. WhatsApp del local (opcional, gratis con CallMeBot)\n1. Desde el WhatsApp que va a recibir los pedidos, segu\u00ed las instrucciones de **callmebot.com** (secci\u00f3n WhatsApp) para obtener tu `apikey`.\n2. Variables: `WHATSAPP_MODO=callmebot`, `CALLMEBOT_TELEFONO=+549...`, `CALLMEBOT_APIKEY=...`\n   (Para mucho volumen pod\u00e9s usar la API oficial de Meta: `WHATSAPP_MODO=cloud` + `WA_TOKEN`, `WA_PHONE_ID`, `WA_DESTINO`.)\n\n### 5. Cocina e impresora de comandas\n1. En la PC o tablet del mostrador abr\u00ed `https://TU-DIRECCION/panel` e ingres\u00e1 la contrase\u00f1a.\n2. Tild\u00e1 **\"Imprimir comanda autom\u00e1ticamente\"**. Dej\u00e1 la impresora t\u00e9rmica (80 mm) como predeterminada.\n3. Para que imprima **sin preguntar**, abr\u00ed Chrome con un acceso directo as\u00ed:\n   `chrome.exe --kiosk-printing https://TU-DIRECCION/panel`\n4. Toc\u00e1 \"\ud83d\udd14 Probar sonido\" una vez para habilitar el aviso sonoro.\n\n### 6. Imprimir los QR\nDesde el panel \u2192 **\ud83d\udd33 QR de mesas** \u2192 Imprimir. Uno por mesa + uno de take away para vidriera, mostrador o Instagram.\n\n## Probar antes de cobrar de verdad\nDej\u00e1 `MP_ACCESS_TOKEN` vac\u00edo (o `MP_MOCK=1`): el sistema funciona completo pero en lugar de Mercado Pago muestra una pantalla de \"pago de prueba\" con botones aprobar/rechazar. Hac\u00e9 un pedido de punta a punta, mir\u00e1 el panel, la comanda y el WhatsApp. Cuando todo est\u00e9 bien, carg\u00e1 el token real.\n\n## Preguntas frecuentes\n- **\u00bfY si el cliente paga pero cierra el celular?** No importa: Mercado Pago avisa al servidor igual y el pedido entra a cocina.\n- **\u00bfY si el pago queda \"en proceso\"?** El pedido espera; entra a cocina autom\u00e1ticamente cuando Mercado Pago lo apruebe.\n- **\u00bfD\u00f3nde veo la plata?** En tu cuenta de Mercado Pago, como cualquier cobro. El panel muestra adem\u00e1s el total cobrado del d\u00eda.\n- **Un pedido figura \"\u26a0\ufe0f monto a revisar\".** El pago recibido no coincide con el total. Revis\u00e1 el n\u00famero de pago en Mercado Pago y, si est\u00e1 bien, toc\u00e1 \"Lo verifiqu\u00e9, preparar\".\n", "menu.json": "{\n  \"negocio\": {\n    \"nombre\": \"Garden Caf\u00e9\",\n    \"slogan\": \"Caf\u00e9 de especialidad \u00b7 Pasteler\u00eda \u00b7 Brunch\",\n    \"direccion\": \"Merlo, Buenos Aires\",\n    \"horario\": \"Lun a Dom \u00b7 8:00 a 20:30\",\n    \"instagram\": \"gardencafe.merlo\",\n    \"takeaway_minutos\": 15\n  },\n  \"categorias\": [\n    { \"id\": \"promos\", \"nombre\": \"Promos\", \"icono\": \"\ud83d\udd25\" },\n    { \"id\": \"cafeteria\", \"nombre\": \"Cafeter\u00eda\", \"icono\": \"\u2615\" },\n    { \"id\": \"frios\", \"nombre\": \"Bebidas fr\u00edas\", \"icono\": \"\ud83e\uddca\" },\n    { \"id\": \"pasteleria\", \"nombre\": \"Pasteler\u00eda\", \"icono\": \"\ud83e\udd50\" },\n    { \"id\": \"brunch\", \"nombre\": \"Brunch y salados\", \"icono\": \"\ud83e\udd51\" }\n  ],\n  \"productos\": [\n    { \"id\": \"promo-desayuno\", \"categoria\": \"promos\", \"nombre\": \"Desayuno Garden\", \"descripcion\": \"Caf\u00e9 con leche mediano + 2 medialunas + jugo de naranja exprimido.\", \"precio\": 8900, \"precio_anterior\": 11200, \"etiqueta\": \"Hasta las 12 hs\", \"disponible\": true },\n    { \"id\": \"promo-merienda\", \"categoria\": \"promos\", \"nombre\": \"Merienda para dos\", \"descripcion\": \"2 caf\u00e9s con leche + 1 porci\u00f3n de torta a elecci\u00f3n + 4 medialunas.\", \"precio\": 16500, \"precio_anterior\": 20400, \"etiqueta\": \"Desde las 16 hs\", \"disponible\": true },\n    { \"id\": \"promo-brunch\", \"categoria\": \"promos\", \"nombre\": \"Brunch Garden\", \"descripcion\": \"Tost\u00f3n de palta y huevo + flat white + limonada + mini muffin.\", \"precio\": 14900, \"precio_anterior\": 18300, \"etiqueta\": \"S\u00e1b y Dom\", \"disponible\": true },\n\n    { \"id\": \"espresso\", \"categoria\": \"cafeteria\", \"nombre\": \"Espresso\", \"descripcion\": \"Doble shot de caf\u00e9 de especialidad.\", \"precio\": 3200, \"disponible\": true },\n    { \"id\": \"cortado\", \"categoria\": \"cafeteria\", \"nombre\": \"Cortado\", \"descripcion\": \"Espresso con un toque de leche texturizada.\", \"precio\": 3500, \"disponible\": true },\n    { \"id\": \"cafe-con-leche\", \"categoria\": \"cafeteria\", \"nombre\": \"Caf\u00e9 con leche\", \"descripcion\": \"Taza mediana. Leche entera, descremada o de almendras.\", \"precio\": 4200, \"disponible\": true },\n    { \"id\": \"flat-white\", \"categoria\": \"cafeteria\", \"nombre\": \"Flat white\", \"descripcion\": \"Doble espresso con leche sedosa.\", \"precio\": 4600, \"disponible\": true },\n    { \"id\": \"capuccino\", \"categoria\": \"cafeteria\", \"nombre\": \"Capuccino\", \"descripcion\": \"Con canela y cacao.\", \"precio\": 4800, \"disponible\": true },\n    { \"id\": \"submarino\", \"categoria\": \"cafeteria\", \"nombre\": \"Submarino\", \"descripcion\": \"Leche caliente con barra de chocolate semiamargo.\", \"precio\": 5200, \"disponible\": true },\n\n    { \"id\": \"limonada\", \"categoria\": \"frios\", \"nombre\": \"Limonada con menta y jengibre\", \"descripcion\": \"Jarra individual 500 ml.\", \"precio\": 4900, \"disponible\": true },\n    { \"id\": \"jugo-naranja\", \"categoria\": \"frios\", \"nombre\": \"Jugo de naranja exprimido\", \"descripcion\": \"Vaso 350 ml.\", \"precio\": 4500, \"disponible\": true },\n    { \"id\": \"iced-latte\", \"categoria\": \"frios\", \"nombre\": \"Iced latte\", \"descripcion\": \"Espresso, leche fr\u00eda y hielo. Opci\u00f3n con caramelo.\", \"precio\": 5300, \"disponible\": true },\n    { \"id\": \"agua\", \"categoria\": \"frios\", \"nombre\": \"Agua mineral\", \"descripcion\": \"500 ml con o sin gas.\", \"precio\": 2500, \"disponible\": true },\n\n    { \"id\": \"medialunas\", \"categoria\": \"pasteleria\", \"nombre\": \"Medialunas x2\", \"descripcion\": \"De manteca, reci\u00e9n horneadas.\", \"precio\": 2800, \"disponible\": true },\n    { \"id\": \"alfajor-maicena\", \"categoria\": \"pasteleria\", \"nombre\": \"Alfajor de maicena\", \"descripcion\": \"Con dulce de leche y coco.\", \"precio\": 2600, \"disponible\": true },\n    { \"id\": \"carrot-cake\", \"categoria\": \"pasteleria\", \"nombre\": \"Carrot cake\", \"descripcion\": \"Porci\u00f3n con frosting de queso crema.\", \"precio\": 6200, \"disponible\": true },\n    { \"id\": \"cheesecake\", \"categoria\": \"pasteleria\", \"nombre\": \"Cheesecake de frutos rojos\", \"descripcion\": \"Porci\u00f3n.\", \"precio\": 6800, \"disponible\": true },\n    { \"id\": \"budin\", \"categoria\": \"pasteleria\", \"nombre\": \"Bud\u00edn de lim\u00f3n y amapola\", \"descripcion\": \"Porci\u00f3n.\", \"precio\": 3900, \"disponible\": false },\n\n    { \"id\": \"toston-palta\", \"categoria\": \"brunch\", \"nombre\": \"Tost\u00f3n de palta\", \"descripcion\": \"Pan de masa madre, palta, huevo poch\u00e9 y semillas.\", \"precio\": 9400, \"disponible\": true },\n    { \"id\": \"tostado\", \"categoria\": \"brunch\", \"nombre\": \"Tostado de jam\u00f3n y queso\", \"descripcion\": \"En pan de miga o \u00e1rabe.\", \"precio\": 7200, \"disponible\": true },\n    { \"id\": \"bowl-yogur\", \"categoria\": \"brunch\", \"nombre\": \"Bowl de yogur\", \"descripcion\": \"Yogur natural, granola casera, frutas de estaci\u00f3n y miel.\", \"precio\": 7800, \"disponible\": true },\n    { \"id\": \"wrap-pollo\", \"categoria\": \"brunch\", \"nombre\": \"Wrap de pollo\", \"descripcion\": \"Pollo grillado, hojas verdes, tomate y aderezo de yogur.\", \"precio\": 10500, \"disponible\": true }\n  ]\n}\n", "package.json": "{\n  \"name\": \"garden-cafe-pedidos\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Carta QR, bot de pedidos y cobro con Mercado Pago para Garden Caf\u00e9 (Merlo)\",\n  \"main\": \"server.js\",\n  \"scripts\": { \"start\": \"node server.js\" },\n  \"engines\": { \"node\": \">=18\" }\n}\n", "render.yaml": "services:\n  - type: web\n    name: garden-cafe\n    runtime: node\n    plan: free\n    buildCommand: \"echo sin dependencias\"\n    startCommand: node server.js\n    healthCheckPath: /healthz\n    envVars:\n      - key: BASE_URL\n        sync: false\n      - key: MP_ACCESS_TOKEN\n        sync: false\n      - key: MP_WEBHOOK_SECRET\n        sync: false\n      - key: PANEL_PASSWORD\n        sync: false\n      - key: CANT_MESAS\n        value: \"12\"\n      - key: WHATSAPP_MODO\n        value: callmebot\n      - key: CALLMEBOT_TELEFONO\n        sync: false\n      - key: CALLMEBOT_APIKEY\n        sync: false\n", "server.js": "// ============================================================\n//  Garden Caf\u00e9 \u00b7 Sistema de pedidos por QR + Mercado Pago\n//  Carta web -> Bot de pedido -> Pago MP -> Verificaci\u00f3n -> Cocina\n// ============================================================\n// Sin dependencias externas: solo Node.js 18+\nconst http = require('http');\nconst crypto = require('crypto');\nconst fs = require('fs');\nconst path = require('path');\n\n// Carga simple de .env (si existe)\ntry {\n  const envFile = path.join(__dirname, '.env');\n  if (fs.existsSync(envFile)) {\n    for (const linea of fs.readFileSync(envFile, 'utf8').split(/\\r?\\n/)) {\n      const m = linea.match(/^\\s*([A-Z0-9_]+)\\s*=\\s*(.*)\\s*$/);\n      if (m && !(m[1] in process.env)) process.env[m[1]] = m[2].replace(/^[\"']|[\"']$/g, '');\n    }\n  }\n} catch {}\n\nconst PORT = process.env.PORT || 3000;\nconst BASE_URL = (process.env.BASE_URL || `http://localhost:${PORT}`).replace(/\\/$/, '');\nconst MP_ACCESS_TOKEN = process.env.MP_ACCESS_TOKEN || '';\nconst MP_WEBHOOK_SECRET = process.env.MP_WEBHOOK_SECRET || '';\nconst MP_API = (process.env.MP_API_BASE || 'https://api.mercadopago.com').replace(/\\/$/, '');\nconst MP_MOCK = process.env.MP_MOCK === '1' || !MP_ACCESS_TOKEN; // modo prueba sin Mercado Pago real\nconst PANEL_PASSWORD = process.env.PANEL_PASSWORD || 'garden1234';\nconst CANT_MESAS = parseInt(process.env.CANT_MESAS || '12', 10);\nconst DATA_DIR = process.env.DATA_DIR || path.join(__dirname, 'data');\nconst SESSION_SECRET = process.env.SESSION_SECRET || crypto.createHash('sha256').update(PANEL_PASSWORD + 'garden').digest('hex');\n\nif (!fs.existsSync(DATA_DIR)) fs.mkdirSync(DATA_DIR, { recursive: true });\nconst ORDERS_FILE = path.join(DATA_DIR, 'pedidos.json');\n\n// ---------- Carta ----------\nconst MENU_FILE = path.join(__dirname, 'menu.json');\nfunction loadMenu() { return JSON.parse(fs.readFileSync(MENU_FILE, 'utf8')); }\n\n// ---------- Almacenamiento simple (archivo JSON) ----------\nlet db = { pedidos: {}, contador: { fecha: '', numero: 0 }, pagosProcesados: {} };\ntry { if (fs.existsSync(ORDERS_FILE)) db = { ...db, ...JSON.parse(fs.readFileSync(ORDERS_FILE, 'utf8')) }; } catch (e) { console.error('No se pudo leer pedidos.json', e); }\nlet saveTimer = null;\nfunction save() {\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(() => {\n    fs.writeFile(ORDERS_FILE + '.tmp', JSON.stringify(db, null, 2), (err) => {\n      if (!err) fs.rename(ORDERS_FILE + '.tmp', ORDERS_FILE, () => {});\n    });\n  }, 200);\n}\nfunction hoyAR() {\n  return new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Argentina/Buenos_Aires' });\n}\nfunction siguienteNumero() {\n  const hoy = hoyAR();\n  if (db.contador.fecha !== hoy) db.contador = { fecha: hoy, numero: 0 };\n  db.contador.numero += 1;\n  return db.contador.numero;\n}\nconst fmt = (n) => '$' + Math.round(n).toLocaleString('es-AR');\n\n// ---------- App ----------\n// ---------- Mini servidor HTTP (compatible con estilo Express) ----------\nconst PUBLIC_DIR = path.join(__dirname, 'public');\nconst MIME = { '.html': 'text/html; charset=utf-8', '.js': 'text/javascript; charset=utf-8', '.css': 'text/css; charset=utf-8', '.json': 'application/json', '.png': 'image/png', '.jpg': 'image/jpeg', '.svg': 'image/svg+xml', '.ico': 'image/x-icon', '.webp': 'image/webp' };\nconst rutas = [];\nconst app = {\n  get: (p, ...h) => rutas.push({ m: 'GET', ...compilar(p), h }),\n  post: (p, ...h) => rutas.push({ m: 'POST', ...compilar(p), h }),\n  listen: (port, cb) => http.createServer(manejar).listen(port, cb),\n};\nfunction compilar(p) {\n  const keys = [];\n  const re = new RegExp('^' + p.replace(/:(\\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '/?$');\n  return { re, keys };\n}\nfunction mejorarRes(res) {\n  res.status = (c) => { res.statusCode = c; return res; };\n  res.json = (o) => { if (!res.headersSent) res.setHeader('Content-Type', 'application/json; charset=utf-8'); res.end(JSON.stringify(o)); };\n  res.send = (t) => res.end(String(t));\n  res.sendStatus = (c) => { res.statusCode = c; res.end(String(c)); };\n}\nfunction servirEstatico(req, res, pathname) {\n  let rel = decodeURIComponent(pathname);\n  if (rel.endsWith('/')) rel += 'index.html';\n  let file = path.normalize(path.join(PUBLIC_DIR, rel));\n  if (!file.startsWith(PUBLIC_DIR)) return false;\n  if (!fs.existsSync(file) && fs.existsSync(file + '.html')) file += '.html';\n  if (!fs.existsSync(file) || !fs.statSync(file).isFile()) return false;\n  res.writeHead(200, { 'Content-Type': MIME[path.extname(file)] || 'application/octet-stream', 'Cache-Control': 'no-cache' });\n  fs.createReadStream(file).pipe(res);\n  return true;\n}\nasync function manejar(req, res) {\n  mejorarRes(res);\n  const url = new URL(req.url, 'http://x');\n  req.query = Object.fromEntries(url.searchParams);\n  req.get = (h) => req.headers[h.toLowerCase()];\n  try {\n    for (const r of rutas) {\n      if (r.m !== req.method) continue;\n      const m = url.pathname.match(r.re);\n      if (!m) continue;\n      req.params = Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])]));\n      if (req.method === 'POST') req.body = await leerJSON(req);\n      let i = 0;\n      const next = async () => { const h = r.h[i++]; if (h) await h(req, res, next); };\n      return await next();\n    }\n    if (req.method === 'GET' && servirEstatico(req, res, url.pathname)) return;\n    res.status(404).json({ error: 'No encontrado' });\n  } catch (e) {\n    console.error(e);\n    if (!res.headersSent) res.status(500).json({ error: 'Error interno' });\n  }\n}\nfunction leerJSON(req) {\n  return new Promise((resolve) => {\n    let d = '';\n    req.on('data', (c) => { d += c; if (d.length > 100000) req.destroy(); });\n    req.on('end', () => { try { resolve(d ? JSON.parse(d) : {}); } catch { resolve({}); } });\n  });\n}\n\n// Carta p\u00fablica\napp.get('/api/menu', (req, res) => res.json(loadMenu()));\napp.get('/api/config', (req, res) => res.json({ mock: MP_MOCK, mesas: CANT_MESAS }));\n\n// ---------- Crear pedido ----------\napp.post('/api/pedidos', async (req, res) => {\n  try {\n    const menu = loadMenu();\n    const { items, modo, mesa, nombre, telefono, hora_retiro, notas } = req.body || {};\n\n    if (!Array.isArray(items) || items.length === 0) return res.status(400).json({ error: 'El pedido est\u00e1 vac\u00edo.' });\n    if (!['mesa', 'takeaway'].includes(modo)) return res.status(400).json({ error: 'Eleg\u00ed mesa o take away.' });\n    const nombreLimpio = String(nombre || '').trim().slice(0, 40);\n    if (!nombreLimpio) return res.status(400).json({ error: 'Falta tu nombre.' });\n    let mesaNum = null;\n    if (modo === 'mesa') {\n      mesaNum = parseInt(mesa, 10);\n      if (!mesaNum || mesaNum < 1 || mesaNum > CANT_MESAS) return res.status(400).json({ error: 'N\u00famero de mesa inv\u00e1lido.' });\n    }\n    const tel = String(telefono || '').replace(/[^\\d+]/g, '').slice(0, 20);\n    if (modo === 'takeaway' && tel.length < 8) return res.status(400).json({ error: 'Para take away necesitamos un tel\u00e9fono.' });\n\n    // Los precios SIEMPRE se toman del servidor, nunca del cliente\n    const lineas = [];\n    for (const it of items.slice(0, 50)) {\n      const p = menu.productos.find((x) => x.id === it.id);\n      const qty = Math.min(Math.max(parseInt(it.qty, 10) || 0, 0), 20);\n      if (!p || !qty) continue;\n      if (!p.disponible) return res.status(400).json({ error: `${p.nombre} no est\u00e1 disponible ahora.` });\n      lineas.push({ id: p.id, nombre: p.nombre, precio: p.precio, qty, subtotal: p.precio * qty });\n    }\n    if (!lineas.length) return res.status(400).json({ error: 'El pedido est\u00e1 vac\u00edo.' });\n    const total = lineas.reduce((a, l) => a + l.subtotal, 0);\n\n    const id = crypto.randomUUID();\n    const pedido = {\n      id,\n      numero: null, // se asigna al confirmarse el pago\n      estado: 'pendiente_pago',\n      modo,\n      mesa: mesaNum,\n      nombre: nombreLimpio,\n      telefono: tel,\n      hora_retiro: modo === 'takeaway' ? String(hora_retiro || 'Lo antes posible').slice(0, 30) : null,\n      notas: String(notas || '').trim().slice(0, 200),\n      items: lineas,\n      total,\n      creado: new Date().toISOString(),\n      pagado: null,\n      pago_id: null,\n    };\n    db.pedidos[id] = pedido;\n    save();\n\n    let checkoutUrl;\n    if (MP_MOCK) {\n      checkoutUrl = `${BASE_URL}/pago-simulado?pedido=${id}`;\n    } else {\n      checkoutUrl = await crearPreferenciaMP(pedido);\n    }\n    res.json({ id, checkout_url: checkoutUrl, total });\n  } catch (e) {\n    console.error('Error creando pedido', e);\n    res.status(500).json({ error: 'No pudimos generar el pago. Prob\u00e1 de nuevo o avis\u00e1 al mozo.' });\n  }\n});\n\nasync function crearPreferenciaMP(pedido) {\n  const menu = loadMenu();\n  const body = {\n    items: pedido.items.map((l) => ({\n      id: l.id,\n      title: l.nombre,\n      quantity: l.qty,\n      unit_price: l.precio,\n      currency_id: 'ARS',\n    })),\n    payer: { name: pedido.nombre },\n    external_reference: pedido.id,\n    notification_url: `${BASE_URL}/api/webhooks/mercadopago`,\n    back_urls: {\n      success: `${BASE_URL}/estado?pedido=${pedido.id}`,\n      pending: `${BASE_URL}/estado?pedido=${pedido.id}`,\n      failure: `${BASE_URL}/estado?pedido=${pedido.id}`,\n    },\n    auto_return: 'approved',\n    statement_descriptor: (menu.negocio.nombre || 'GARDEN CAFE').toUpperCase().slice(0, 22),\n    expires: true,\n    expiration_date_to: new Date(Date.now() + 30 * 60 * 1000).toISOString(),\n    metadata: { pedido_id: pedido.id, modo: pedido.modo, mesa: pedido.mesa },\n  };\n  const r = await fetch(`${MP_API}/checkout/preferences`, {\n    method: 'POST',\n    headers: {\n      Authorization: `Bearer ${MP_ACCESS_TOKEN}`,\n      'Content-Type': 'application/json',\n      'X-Idempotency-Key': pedido.id,\n    },\n    body: JSON.stringify(body),\n  });\n  const data = await r.json();\n  if (!r.ok) throw new Error('MP preference error: ' + JSON.stringify(data));\n  pedido.preferencia_id = data.id;\n  save();\n  return data.init_point;\n}\n\n// ---------- Verificaci\u00f3n de pago ----------\nasync function obtenerPagoMP(paymentId) {\n  const r = await fetch(`${MP_API}/v1/payments/${encodeURIComponent(paymentId)}`, {\n    headers: { Authorization: `Bearer ${MP_ACCESS_TOKEN}` },\n  });\n  if (!r.ok) throw new Error(`No se pudo consultar el pago ${paymentId}: ${r.status}`);\n  return r.json();\n}\n\n// Aplica el resultado de un pago YA consultado a Mercado Pago (fuente de verdad)\nfunction aplicarPago(pago) {\n  const pedido = db.pedidos[pago.external_reference];\n  if (!pedido) return { ok: false, motivo: 'pedido inexistente' };\n\n  if (pago.status === 'approved') {\n    if (pedido.estado !== 'pendiente_pago' && pedido.estado !== 'rechazado') return { ok: true, pedido, repetido: true };\n    const montoOk = Number(pago.transaction_amount) + 0.01 >= pedido.total && (pago.currency_id || 'ARS') === 'ARS';\n    if (!montoOk) {\n      pedido.estado = 'revisar_pago';\n      pedido.pago_id = String(pago.id);\n      save();\n      console.warn('Monto no coincide', pedido.id, pago.transaction_amount, pedido.total);\n      emitir('pedido', publicoPanel(pedido));\n      return { ok: false, motivo: 'monto no coincide', pedido };\n    }\n    pedido.estado = 'pagado';\n    pedido.pagado = new Date().toISOString();\n    pedido.pago_id = String(pago.id);\n    pedido.numero = siguienteNumero();\n    save();\n    console.log(`\u2705 Pedido #${pedido.numero} pagado (${fmt(pedido.total)}) - ${pedido.modo}`);\n    despacharPedido(pedido);\n    return { ok: true, pedido };\n  }\n  if (['rejected', 'cancelled'].includes(pago.status) && pedido.estado === 'pendiente_pago') {\n    pedido.estado = 'rechazado';\n    save();\n  }\n  return { ok: false, motivo: pago.status, pedido };\n}\n\n// Validaci\u00f3n de firma x-signature de Mercado Pago\nfunction firmaValida(req, dataId) {\n  if (!MP_WEBHOOK_SECRET) return true; // si no configuraste la clave, igual se verifica consultando el pago a MP\n  const sig = req.get('x-signature') || '';\n  const requestId = req.get('x-request-id') || '';\n  const partes = Object.fromEntries(sig.split(',').map((p) => p.trim().split('=')));\n  if (!partes.ts || !partes.v1) return false;\n  const id = /^[a-z0-9]+$/i.test(dataId) ? String(dataId).toLowerCase() : dataId;\n  let manifest = '';\n  if (id) manifest += `id:${id};`;\n  if (requestId) manifest += `request-id:${requestId};`;\n  manifest += `ts:${partes.ts};`;\n  const hmac = crypto.createHmac('sha256', MP_WEBHOOK_SECRET).update(manifest).digest('hex');\n  try { return crypto.timingSafeEqual(Buffer.from(hmac), Buffer.from(partes.v1)); } catch { return false; }\n}\n\napp.post('/api/webhooks/mercadopago', async (req, res) => {\n  const tipo = req.query.type || req.query.topic || req.body?.type;\n  const dataId = req.query['data.id'] || req.query.id || req.body?.data?.id;\n  if (!firmaValida(req, dataId)) {\n    console.warn('Webhook con firma inv\u00e1lida');\n    return res.sendStatus(401);\n  }\n  res.sendStatus(200); // respondemos r\u00e1pido; MP reintenta si no\n  if (tipo !== 'payment' || !dataId || MP_MOCK) return;\n  if (db.pagosProcesados[dataId] === 'approved') return;\n  try {\n    const pago = await obtenerPagoMP(dataId);\n    db.pagosProcesados[dataId] = pago.status;\n    aplicarPago(pago);\n  } catch (e) {\n    console.error('Error procesando webhook', e.message);\n  }\n});\n\n// Respaldo: cuando el cliente vuelve de MP con payment_id verificamos al instante\napp.post('/api/pedidos/:id/verificar', async (req, res) => {\n  const pedido = db.pedidos[req.params.id];\n  if (!pedido) return res.status(404).json({ error: 'Pedido no encontrado' });\n  const paymentId = String(req.body?.payment_id || '').replace(/\\D/g, '');\n  if (!MP_MOCK && paymentId && pedido.estado === 'pendiente_pago') {\n    try {\n      const pago = await obtenerPagoMP(paymentId);\n      if (pago.external_reference === pedido.id) aplicarPago(pago);\n    } catch (e) { console.error(e.message); }\n  }\n  res.json(publicoCliente(pedido));\n});\n\napp.get('/api/pedidos/:id', (req, res) => {\n  const pedido = db.pedidos[req.params.id];\n  if (!pedido) return res.status(404).json({ error: 'Pedido no encontrado' });\n  res.json(publicoCliente(pedido));\n});\n\nfunction publicoCliente(p) {\n  return { id: p.id, numero: p.numero, estado: p.estado, modo: p.modo, mesa: p.mesa, nombre: p.nombre, hora_retiro: p.hora_retiro, items: p.items, total: p.total, notas: p.notas };\n}\nfunction publicoPanel(p) { return { ...publicoCliente(p), telefono: p.telefono, creado: p.creado, pagado: p.pagado, pago_id: p.pago_id }; }\n\n// ---------- Modo prueba (sin Mercado Pago real) ----------\napp.post('/api/simular-pago/:id', (req, res) => {\n  if (!MP_MOCK) return res.status(403).json({ error: 'Deshabilitado en producci\u00f3n' });\n  const pedido = db.pedidos[req.params.id];\n  if (!pedido) return res.status(404).json({ error: 'Pedido no encontrado' });\n  const aprobado = req.body?.resultado !== 'rechazado';\n  aplicarPago({ id: 'TEST-' + Date.now(), status: aprobado ? 'approved' : 'rejected', external_reference: pedido.id, transaction_amount: pedido.total, currency_id: 'ARS' });\n  res.json(publicoCliente(pedido));\n});\n\n// ---------- Despacho: panel + impresi\u00f3n + WhatsApp ----------\nfunction despacharPedido(pedido) {\n  emitir('pedido', publicoPanel(pedido));\n  enviarWhatsApp(pedido).catch((e) => console.error('WhatsApp:', e.message));\n}\n\nfunction textoPedido(p) {\n  const destino = p.modo === 'mesa' ? `\ud83c\udf7d\ufe0f MESA ${p.mesa}` : `\ud83d\udecd\ufe0f TAKE AWAY \u00b7 retira ${p.hora_retiro}`;\n  const lineas = p.items.map((l) => `\u2022 ${l.qty} x ${l.nombre}`).join('\\n');\n  return `\u2615 *Garden Caf\u00e9 \u00b7 Pedido #${String(p.numero).padStart(3, '0')}* (PAGADO \u2705)\\n${destino}\\n\ud83d\udc64 ${p.nombre}${p.telefono ? ' \u00b7 ' + p.telefono : ''}\\n\\n${lineas}${p.notas ? `\\n\\n\ud83d\udcdd ${p.notas}` : ''}\\n\\nTotal: ${fmt(p.total)} \u00b7 MP #${p.pago_id}`;\n}\n\nasync function enviarWhatsApp(p) {\n  const texto = textoPedido(p);\n  const modo = (process.env.WHATSAPP_MODO || '').toLowerCase();\n  if (modo === 'callmebot' && process.env.CALLMEBOT_TELEFONO && process.env.CALLMEBOT_APIKEY) {\n    const url = `https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(process.env.CALLMEBOT_TELEFONO)}&text=${encodeURIComponent(texto)}&apikey=${encodeURIComponent(process.env.CALLMEBOT_APIKEY)}`;\n    const r = await fetch(url);\n    if (!r.ok) throw new Error('CallMeBot ' + r.status);\n  } else if (modo === 'cloud' && process.env.WA_TOKEN && process.env.WA_PHONE_ID && process.env.WA_DESTINO) {\n    const r = await fetch(`https://graph.facebook.com/v21.0/${process.env.WA_PHONE_ID}/messages`, {\n      method: 'POST',\n      headers: { Authorization: `Bearer ${process.env.WA_TOKEN}`, 'Content-Type': 'application/json' },\n      body: JSON.stringify({ messaging_product: 'whatsapp', to: process.env.WA_DESTINO, type: 'text', text: { body: texto } }),\n    });\n    if (!r.ok) throw new Error('WhatsApp Cloud ' + r.status + ' ' + (await r.text()));\n  } else {\n    console.log('[WhatsApp desactivado] Mensaje que se enviar\u00eda:\\n' + texto);\n  }\n}\n\n// ---------- Panel de cocina (con contrase\u00f1a) ----------\nfunction firmar(v) { return crypto.createHmac('sha256', SESSION_SECRET).update(v).digest('hex'); }\nfunction tokenPanel() { const exp = Date.now() + 1000 * 60 * 60 * 24 * 30; return `${exp}.${firmar(String(exp))}`; }\nfunction leerCookie(req, nombre) {\n  const m = (req.headers.cookie || '').split(';').map((c) => c.trim()).find((c) => c.startsWith(nombre + '='));\n  return m ? decodeURIComponent(m.slice(nombre.length + 1)) : '';\n}\nfunction autorizado(req) {\n  const [exp, sig] = leerCookie(req, 'panel').split('.');\n  if (!exp || !sig || Number(exp) < Date.now()) return false;\n  try { return crypto.timingSafeEqual(Buffer.from(sig), Buffer.from(firmar(exp))); } catch { return false; }\n}\nfunction soloPanel(req, res, next) { if (autorizado(req)) return next(); res.status(401).json({ error: 'No autorizado' }); }\n\napp.post('/api/panel/login', (req, res) => {\n  const pass = String(req.body?.password || '');\n  const ok = pass.length === PANEL_PASSWORD.length && crypto.timingSafeEqual(Buffer.from(pass), Buffer.from(PANEL_PASSWORD));\n  if (!ok) return res.status(401).json({ error: 'Contrase\u00f1a incorrecta' });\n  const secure = BASE_URL.startsWith('https') ? '; Secure' : '';\n  res.setHeader('Set-Cookie', `panel=${tokenPanel()}; HttpOnly; Path=/; Max-Age=${60 * 60 * 24 * 30}; SameSite=Lax${secure}`);\n  res.json({ ok: true });\n});\napp.get('/api/panel/sesion', (req, res) => res.json({ ok: autorizado(req) }));\n\nconst ESTADOS_COCINA = ['pagado', 'en_preparacion', 'listo', 'entregado', 'revisar_pago'];\napp.get('/api/panel/pedidos', soloPanel, (req, res) => {\n  const hace24 = Date.now() - 24 * 3600 * 1000;\n  const lista = Object.values(db.pedidos)\n    .filter((p) => ESTADOS_COCINA.includes(p.estado) && new Date(p.pagado || p.creado).getTime() > hace24)\n    .sort((a, b) => (a.pagado || a.creado).localeCompare(b.pagado || b.creado))\n    .map(publicoPanel);\n  res.json(lista);\n});\n\napp.post('/api/panel/pedidos/:id/estado', soloPanel, (req, res) => {\n  const p = db.pedidos[req.params.id];\n  const estado = req.body?.estado;\n  if (!p) return res.status(404).json({ error: 'No existe' });\n  if (!['en_preparacion', 'listo', 'entregado'].includes(estado)) return res.status(400).json({ error: 'Estado inv\u00e1lido' });\n  if (p.estado === 'revisar_pago' && estado === 'en_preparacion') {\n    // El encargado verific\u00f3 el pago a mano en Mercado Pago y lo aprueba\n    p.numero = siguienteNumero();\n    p.pagado = new Date().toISOString();\n  } else if (!['pagado', 'en_preparacion', 'listo', 'entregado'].includes(p.estado)) return res.status(400).json({ error: 'El pedido no est\u00e1 pagado' });\n  p.estado = estado;\n  save();\n  emitir('pedido', publicoPanel(p));\n  res.json(publicoPanel(p));\n});\n\n// Resumen del d\u00eda\napp.get('/api/panel/resumen', soloPanel, (req, res) => {\n  const hoy = hoyAR();\n  const pagados = Object.values(db.pedidos).filter((p) => p.pagado && new Date(p.pagado).toLocaleDateString('sv-SE', { timeZone: 'America/Argentina/Buenos_Aires' }) === hoy);\n  res.json({\n    pedidos: pagados.length,\n    total: pagados.reduce((a, p) => a + p.total, 0),\n    mesa: pagados.filter((p) => p.modo === 'mesa').length,\n    takeaway: pagados.filter((p) => p.modo === 'takeaway').length,\n  });\n});\n\n// Tiempo real (Server-Sent Events)\nconst clientesSSE = new Set();\napp.get('/api/panel/stream', soloPanel, (req, res) => {\n  res.writeHead(200, { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache', Connection: 'keep-alive', 'X-Accel-Buffering': 'no' });\n  res.write('retry: 3000\\n\\n');\n  clientesSSE.add(res);\n  const ping = setInterval(() => res.write(': ping\\n\\n'), 25000);\n  req.on('close', () => { clearInterval(ping); clientesSSE.delete(res); });\n});\nfunction emitir(evento, data) {\n  const msg = `event: ${evento}\\ndata: ${JSON.stringify(data)}\\n\\n`;\n  for (const c of clientesSSE) c.write(msg);\n}\n\n// ---------- Datos para el generador de QR (se dibujan en el navegador) ----------\napp.get('/api/panel/qrs', soloPanel, (req, res) => {\n  const lista = [];\n  for (let i = 1; i <= CANT_MESAS; i++) lista.push({ titulo: `Mesa ${i}`, url: `${BASE_URL}/?mesa=${i}` });\n  lista.push({ titulo: 'Take away', url: `${BASE_URL}/?modo=takeaway` });\n  res.json(lista);\n});\n\napp.get('/healthz', (req, res) => res.send('ok'));\n\napp.listen(PORT, () => {\n  console.log(`\\n\u2615 Garden Caf\u00e9 corriendo en ${BASE_URL}`);\n  console.log(`   Carta:  ${BASE_URL}/?mesa=1`);\n  console.log(`   Panel:  ${BASE_URL}/panel`);\n  console.log(`   Modo pago: ${MP_MOCK ? 'PRUEBA (sin Mercado Pago real)' : 'Mercado Pago REAL'}\\n`);\n});\n", "public/app.js": "// ===== Garden Caf\u00e9 \u00b7 Carta + Garden Bot =====\nconst $ = (s) => document.querySelector(s);\nconst fmt = (n) => '$' + Math.round(n).toLocaleString('es-AR');\nconst params = new URLSearchParams(location.search);\n\nconst store = {\n  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },\n};\n\n// Mesa / take away seg\u00fan el QR escaneado\nif (params.get('mesa')) store.set('gc_origen', { modo: 'mesa', mesa: parseInt(params.get('mesa'), 10) });\nif (params.get('modo') === 'takeaway') store.set('gc_origen', { modo: 'takeaway' });\nconst origen = store.get('gc_origen', null);\n\nlet MENU = null;\nlet CONFIG = { mesas: 12 };\nlet carrito = store.get('gc_carrito', {}); // { idProducto: cantidad }\n\nfunction producto(id) { return MENU.productos.find((p) => p.id === id); }\nfunction lineasCarrito() {\n  return Object.entries(carrito)\n    .map(([id, qty]) => ({ p: producto(id), qty }))\n    .filter((l) => l.p && l.p.disponible && l.qty > 0);\n}\nfunction total() { return lineasCarrito().reduce((a, l) => a + l.p.precio * l.qty, 0); }\nfunction cantidad() { return lineasCarrito().reduce((a, l) => a + l.qty, 0); }\n\nfunction cambiar(id, delta) {\n  carrito[id] = Math.max(0, Math.min(20, (carrito[id] || 0) + delta));\n  if (!carrito[id]) delete carrito[id];\n  store.set('gc_carrito', carrito);\n  actualizarUI();\n}\n\n// ---------- Render carta ----------\nasync function iniciar() {\n  const [m, c] = await Promise.all([fetch('/api/menu').then((r) => r.json()), fetch('/api/config').then((r) => r.json())]);\n  MENU = m; CONFIG = c;\n  const n = MENU.negocio;\n  document.title = `${n.nombre} \u00b7 Carta`;\n  $('#nombre-negocio').textContent = n.nombre;\n  $('#slogan').textContent = n.slogan;\n  $('#chip-horario').textContent = '\ud83d\udd57 ' + n.horario;\n  if (origen) {\n    const chip = $('#chip-modo');\n    chip.hidden = false;\n    chip.textContent = origen.modo === 'mesa' ? `\ud83c\udf7d\ufe0f Mesa ${origen.mesa}` : '\ud83d\udecd\ufe0f Take away';\n  }\n  $('#pie').innerHTML = `${n.nombre} \u00b7 ${n.direccion}<br>${n.instagram ? '@' + n.instagram : ''}`;\n\n  const tabs = $('#tabs');\n  const carta = $('#carta');\n  carta.innerHTML = '';\n  for (const cat of MENU.categorias) {\n    const prods = MENU.productos.filter((p) => p.categoria === cat.id);\n    if (!prods.length) continue;\n    const t = document.createElement('button');\n    t.className = 'tab';\n    t.textContent = `${cat.icono || ''} ${cat.nombre}`.trim();\n    t.dataset.cat = cat.id;\n    t.onclick = () => document.getElementById('cat-' + cat.id).scrollIntoView({ behavior: 'smooth' });\n    tabs.appendChild(t);\n\n    const sec = document.createElement('section');\n    sec.className = 'cat';\n    sec.id = 'cat-' + cat.id;\n    sec.innerHTML = `<h2>${cat.icono || ''} ${cat.nombre}<\/h2><div class=\"lista\"><\/div>`;\n    const lista = sec.querySelector('.lista');\n    for (const p of prods) {\n      const el = document.createElement('article');\n      el.className = 'prod' + (p.categoria === 'promos' ? ' promo' : '') + (p.disponible ? '' : ' agotado');\n      el.innerHTML = `\n        <div class=\"info\">\n          ${p.etiqueta ? `<span class=\"etiqueta\">${p.etiqueta}<\/span>` : ''}\n          <h3>${p.nombre}<\/h3>\n          <p>${p.descripcion || ''}<\/p>\n          <div class=\"precio\">${fmt(p.precio)}${p.precio_anterior ? `<s>${fmt(p.precio_anterior)}<\/s>` : ''}<\/div>\n        <\/div>\n        ${p.disponible\n          ? `<div class=\"cant\" data-id=\"${p.id}\"><button class=\"menos\" aria-label=\"Quitar\">\u2212<\/button><span>0<\/span><button class=\"mas\" aria-label=\"Agregar\">+<\/button><\/div>`\n          : `<span class=\"sin-stock\">Sin stock<\/span>`}`;\n      const cant = el.querySelector('.cant');\n      if (cant) {\n        cant.querySelector('.mas').onclick = () => cambiar(p.id, 1);\n        cant.querySelector('.menos').onclick = () => cambiar(p.id, -1);\n      }\n      lista.appendChild(el);\n    }\n    carta.appendChild(sec);\n  }\n  // Tab activa seg\u00fan scroll\n  const obs = new IntersectionObserver((entries) => {\n    entries.forEach((e) => {\n      if (e.isIntersecting) {\n        document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('activa', 'cat-' + t.dataset.cat === e.target.id));\n      }\n    });\n  }, { rootMargin: '-40% 0px -55% 0px' });\n  document.querySelectorAll('section.cat').forEach((s) => obs.observe(s));\n  actualizarUI();\n}\n\nfunction actualizarUI() {\n  document.querySelectorAll('.cant').forEach((c) => {\n    const q = carrito[c.dataset.id] || 0;\n    c.querySelector('span').textContent = q;\n    c.querySelector('.menos').style.visibility = q ? 'visible' : 'hidden';\n    c.querySelector('span').style.visibility = q ? 'visible' : 'hidden';\n  });\n  const cant = cantidad();\n  $('#cant-items').textContent = cant;\n  $('#total-barra').textContent = fmt(total());\n  $('#barra').classList.toggle('visible', cant > 0);\n  if (resumenVivo) pintarResumen(resumenVivo);\n}\n\n// ---------- Garden Bot ----------\nconst chat = $('#chat');\nconst opciones = $('#opciones');\nlet pedido = {};\nlet resumenVivo = null;\n\nconst esperar = (ms) => new Promise((r) => setTimeout(r, ms));\nasync function botDice(html, { esElemento = false } = {}) {\n  const typing = document.createElement('div');\n  typing.className = 'msg bot-msg escribiendo';\n  typing.textContent = 'escribiendo\u2026';\n  chat.appendChild(typing);\n  scrollChat();\n  await esperar(450);\n  typing.remove();\n  const m = document.createElement('div');\n  m.className = 'msg bot-msg';\n  if (esElemento) m.appendChild(html); else m.innerHTML = html;\n  chat.appendChild(m);\n  scrollChat();\n  return m;\n}\nfunction yoDigo(texto) {\n  const m = document.createElement('div');\n  m.className = 'msg yo';\n  m.textContent = texto;\n  chat.appendChild(m);\n  scrollChat();\n}\nfunction scrollChat() { chat.scrollTop = chat.scrollHeight; }\n\nfunction botones(lista) {\n  return new Promise((resolve) => {\n    opciones.innerHTML = '';\n    lista.forEach((b) => {\n      const el = document.createElement('button');\n      el.className = 'op' + (b.fuerte ? ' fuerte' : '');\n      el.textContent = b.texto;\n      el.onclick = () => { opciones.innerHTML = ''; if (!b.silencioso) yoDigo(b.texto); resolve(b.valor); };\n      opciones.appendChild(el);\n    });\n  });\n}\nfunction preguntar({ placeholder, tipo = 'text', validar, extra }) {\n  return new Promise((resolve) => {\n    opciones.innerHTML = '';\n    const f = document.createElement('form');\n    f.innerHTML = `<input type=\"${tipo}\" placeholder=\"${placeholder}\" autocomplete=\"off\" ${tipo === 'tel' ? 'inputmode=\"tel\"' : ''} ${tipo === 'number' ? 'inputmode=\"numeric\"' : ''}><button>Enviar<\/button>`;\n    const input = f.querySelector('input');\n    const err = document.createElement('div');\n    err.className = 'error';\n    f.onsubmit = (e) => {\n      e.preventDefault();\n      const v = input.value.trim();\n      const problema = validar ? validar(v) : (!v ? 'Complet\u00e1 este dato' : null);\n      if (problema) { err.textContent = problema; return; }\n      opciones.innerHTML = '';\n      yoDigo(v);\n      resolve(v);\n    };\n    opciones.appendChild(f);\n    if (extra) {\n      const b = document.createElement('button');\n      b.className = 'op';\n      b.textContent = extra.texto;\n      b.onclick = () => { opciones.innerHTML = ''; yoDigo(extra.texto); resolve(extra.valor); };\n      opciones.appendChild(b);\n    }\n    opciones.appendChild(err);\n    setTimeout(() => input.focus(), 50);\n  });\n}\n\nfunction pintarResumen(cont) {\n  const lineas = lineasCarrito();\n  cont.innerHTML = '';\n  const div = document.createElement('div');\n  div.className = 'resumen';\n  lineas.forEach((l) => {\n    const row = document.createElement('div');\n    row.className = 'linea';\n    row.innerHTML = `<span class=\"mini\"><button data-a=\"-\">\u2212<\/button><b>${l.qty}<\/b><button data-a=\"+\">+<\/button>&nbsp;${l.p.nombre}<\/span><span>${fmt(l.p.precio * l.qty)}<\/span>`;\n    row.querySelector('[data-a=\"-\"]').onclick = () => cambiar(l.p.id, -1);\n    row.querySelector('[data-a=\"+\"]').onclick = () => cambiar(l.p.id, 1);\n    div.appendChild(row);\n  });\n  const t = document.createElement('div');\n  t.className = 'linea total';\n  t.innerHTML = `<span>Total<\/span><span>${fmt(total())}<\/span>`;\n  div.appendChild(t);\n  cont.appendChild(div);\n}\n\nfunction abrirBot() {\n  $('#bot').classList.add('abierto');\n  $('#bot').setAttribute('aria-hidden', 'false');\n  flujo();\n}\nfunction cerrarBot() {\n  $('#bot').classList.remove('abierto');\n  $('#bot').setAttribute('aria-hidden', 'true');\n  resumenVivo = null;\n  chat.innerHTML = '';\n  opciones.innerHTML = '';\n  flujoId++;\n}\nlet flujoId = 0;\n\nasync function flujo() {\n  const miFlujo = ++flujoId;\n  const vivo = () => miFlujo === flujoId;\n  chat.innerHTML = '';\n  pedido = {};\n  const recordado = store.get('gc_cliente', {});\n\n  await botDice(`\u00a1Hola! \ud83d\udc4b Soy <b>Garden Bot<\/b>. Revis\u00e1 tu pedido (pod\u00e9s sumar o quitar):`);\n  if (!vivo()) return;\n  const cont = document.createElement('div');\n  resumenVivo = cont;\n  pintarResumen(cont);\n  await botDice(cont, { esElemento: true });\n  const ok = await botones([{ texto: 'Seguir mirando la carta', valor: false }, { texto: 'Confirmar pedido \u2713', valor: true, fuerte: true }]);\n  if (!vivo()) return;\n  if (!ok || cantidad() === 0) return cerrarBot();\n  resumenVivo = null;\n  cont.querySelectorAll('button').forEach((b) => b.remove());\n\n  // \u00bfMesa o take away?\n  if (origen && origen.modo === 'mesa') {\n    await botDice(`Veo que est\u00e1s en la <b>Mesa ${origen.mesa}<\/b> \ud83c\udf7d\ufe0f \u00bfTe lo llevamos ah\u00ed?`);\n    const r = await botones([{ texto: `S\u00ed, a la mesa ${origen.mesa}`, valor: 'mesa', fuerte: true }, { texto: 'No, es para llevar', valor: 'takeaway' }]);\n    pedido.modo = r;\n    if (r === 'mesa') pedido.mesa = origen.mesa;\n  } else if (origen && origen.modo === 'takeaway') {\n    pedido.modo = 'takeaway';\n    await botDice('Perfecto, tu pedido es <b>para llevar<\/b> \ud83d\udecd\ufe0f');\n  } else {\n    await botDice('\u00bfLo tom\u00e1s ac\u00e1 o es para llevar?');\n    pedido.modo = await botones([{ texto: '\ud83c\udf7d\ufe0f Ac\u00e1 en el local', valor: 'mesa' }, { texto: '\ud83d\udecd\ufe0f Take away', valor: 'takeaway' }]);\n  }\n  if (!vivo()) return;\n  if (pedido.modo === 'mesa' && !pedido.mesa) {\n    await botDice('\u00bfEn qu\u00e9 n\u00famero de mesa est\u00e1s? (est\u00e1 en el QR de la mesa)');\n    pedido.mesa = parseInt(await preguntar({ placeholder: 'N\u00ba de mesa', tipo: 'number', validar: (v) => { const n = parseInt(v, 10); return n >= 1 && n <= CONFIG.mesas ? null : `Pon\u00e9 un n\u00famero entre 1 y ${CONFIG.mesas}`; } }), 10);\n  }\n  if (!vivo()) return;\n\n  // Nombre\n  if (recordado.nombre) {\n    await botDice(`\u00bfEl pedido va a nombre de <b>${escapar(recordado.nombre)}<\/b>?`);\n    const r = await botones([{ texto: 'S\u00ed', valor: true, fuerte: true }, { texto: 'Otro nombre', valor: false }]);\n    pedido.nombre = r ? recordado.nombre : null;\n  }\n  if (!pedido.nombre) {\n    await botDice('\u00bfA nombre de qui\u00e9n lo anotamos?');\n    pedido.nombre = await preguntar({ placeholder: 'Tu nombre', validar: (v) => (v.length < 2 ? 'Escrib\u00ed tu nombre' : null) });\n  }\n  if (!vivo()) return;\n\n  // Take away: tel\u00e9fono y horario\n  if (pedido.modo === 'takeaway') {\n    await botDice('\u00bfA qu\u00e9 n\u00famero te avisamos cuando est\u00e9 listo? \ud83d\udcf1');\n    pedido.telefono = await preguntar({ placeholder: 'Ej: 11 2345 6789', tipo: 'tel', validar: (v) => (v.replace(/\\D/g, '').length < 8 ? 'Revis\u00e1 el n\u00famero' : null) });\n    if (!vivo()) return;\n    const min = MENU.negocio.takeaway_minutos || 15;\n    await botDice('\u00bfCu\u00e1ndo pas\u00e1s a retirar?');\n    pedido.hora_retiro = await botones([\n      { texto: `Lo antes posible (~${min} min)`, valor: `Lo antes posible (~${min} min)` },\n      { texto: 'En 30 minutos', valor: 'En 30 min' },\n      { texto: 'En 1 hora', valor: 'En 1 hora' },\n    ]);\n  }\n  if (!vivo()) return;\n  store.set('gc_cliente', { nombre: pedido.nombre });\n\n  // Aclaraciones\n  await botDice('\u00bfAlguna aclaraci\u00f3n para la cocina? (sin az\u00facar, leche vegetal, sin TACC\u2026)');\n  const nota = await preguntar({ placeholder: 'Escrib\u00ed tu aclaraci\u00f3n', validar: () => null, extra: { texto: 'No, nada m\u00e1s', valor: '' } });\n  pedido.notas = nota === 'No, nada m\u00e1s' ? '' : nota;\n  if (!vivo()) return;\n\n  // Resumen final + pago\n  const destino = pedido.modo === 'mesa' ? `\ud83c\udf7d\ufe0f Mesa ${pedido.mesa}` : `\ud83d\udecd\ufe0f Take away \u00b7 ${pedido.hora_retiro}`;\n  await botDice(`Listo, <b>${escapar(pedido.nombre)}<\/b>. Este es tu pedido:<br><br>${destino}<br>${lineasCarrito().map((l) => `\u2022 ${l.qty} \u00d7 ${l.p.nombre}`).join('<br>')}${pedido.notas ? `<br>\ud83d\udcdd ${escapar(pedido.notas)}` : ''}<br><br><b>Total: ${fmt(total())}<\/b>`);\n  await botDice('Pagalo con Mercado Pago (tarjeta, d\u00e9bito, dinero en cuenta o QR). Apenas se confirme el pago, lo mandamos a cocina \ud83d\udc69\u200d\ud83c\udf73');\n  if (!vivo()) return;\n  mostrarBotonPago();\n}\n\nfunction mostrarBotonPago() {\n  opciones.innerHTML = '';\n  const b = document.createElement('button');\n  b.className = 'btn-mp';\n  b.innerHTML = `Pagar ${fmt(total())} con Mercado Pago`;\n  const err = document.createElement('div');\n  err.className = 'error';\n  b.onclick = async () => {\n    b.disabled = true;\n    b.textContent = 'Generando pago seguro\u2026';\n    err.textContent = '';\n    try {\n      const r = await fetch('/api/pedidos', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ ...pedido, items: lineasCarrito().map((l) => ({ id: l.p.id, qty: l.qty })) }),\n      });\n      const data = await r.json();\n      if (!r.ok) throw new Error(data.error || 'Error');\n      store.set('gc_ultimo_pedido', data.id);\n      location.href = data.checkout_url;\n    } catch (e) {\n      err.textContent = e.message;\n      b.disabled = false;\n      b.innerHTML = `Pagar ${fmt(total())} con Mercado Pago`;\n    }\n  };\n  opciones.appendChild(b);\n  opciones.appendChild(err);\n}\n\nfunction escapar(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }\n\n$('#btn-carrito').onclick = abrirBot;\n$('#cerrar-bot').onclick = cerrarBot;\niniciar().catch(() => { $('#carta').innerHTML = '<p class=\"centro\">No pudimos cargar la carta. Recarg\u00e1 la p\u00e1gina.<\/p>'; });\n", "public/estado.html": "<!doctype html>\n<html lang=\"es-AR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <meta name=\"theme-color\" content=\"#1f3a2c\">\n  <title>Garden Caf\u00e9 \u00b7 Tu pedido<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css\">\n<\/head>\n<body>\n  <header class=\"hero\"><div class=\"contenedor\"><h1>Garden Caf\u00e9<\/h1><p>Seguimiento de tu pedido<\/p><\/div><\/header>\n  <main class=\"contenedor\">\n    <div class=\"tarjeta centro\" id=\"tarjeta\"><div class=\"spinner\"><\/div><p>Verificando tu pago con Mercado Pago\u2026<\/p><\/div>\n    <div class=\"tarjeta\" id=\"detalle\" hidden><\/div>\n    <p class=\"centro\"><a class=\"btn-sec\" href=\"/\">Volver a la carta<\/a><\/p>\n  <\/main>\n<script>\nconst fmt = (n) => '$' + Math.round(n).toLocaleString('es-AR');\nconst q = new URLSearchParams(location.search);\nlet id = q.get('pedido') || q.get('external_reference');\ntry { id = id || JSON.parse(localStorage.getItem('gc_ultimo_pedido')); } catch {}\nconst paymentId = q.get('payment_id') || q.get('collection_id') || '';\nconst esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };\nlet ultimoEstado = null;\n\nasync function consultar(primera) {\n  if (!id) return pintar({ estado: 'sin_pedido' });\n  try {\n    const r = primera\n      ? await fetch(`/api/pedidos/${id}/verificar`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ payment_id: paymentId }) })\n      : await fetch(`/api/pedidos/${id}`);\n    if (!r.ok) return pintar({ estado: 'sin_pedido' });\n    pintar(await r.json());\n  } catch {}\n}\n\nfunction pintar(p) {\n  const t = document.getElementById('tarjeta');\n  const det = document.getElementById('detalle');\n  if (p.estado === ultimoEstado) return;\n  ultimoEstado = p.estado;\n  const num = p.numero ? String(p.numero).padStart(3, '0') : '';\n  const takeaway = p.modo === 'takeaway';\n  const pasos = ['pagado', 'en_preparacion', 'listo', 'entregado'];\n  const idx = pasos.indexOf(p.estado);\n  const barra = `<div class=\"pasos\">${['Pagado', 'Preparando', 'Listo', takeaway ? 'Retirado' : 'Servido'].map((n, i) => `<div class=\"paso ${i <= idx ? 'hecho' : ''}\"><div class=\"punto\"><\/div>${n}<\/div>`).join('')}<\/div>`;\n\n  const vistas = {\n    sin_pedido: `<div class=\"icono-grande\">\ud83e\udd14<\/div><h2>No encontramos el pedido<\/h2><p>Si ya pagaste, mostrale el comprobante de Mercado Pago al personal.<\/p>`,\n    pendiente_pago: `<div class=\"spinner\"><\/div><h2>Esperando confirmaci\u00f3n del pago<\/h2><p>Si pagaste en efectivo (Rapipago/Pago F\u00e1cil) o el pago qued\u00f3 \"en proceso\", te avisamos ac\u00e1 apenas se acredite. No cierres esta p\u00e1gina.<\/p>`,\n    rechazado: `<div class=\"icono-grande\">\u26a0\ufe0f<\/div><h2>El pago no se complet\u00f3<\/h2><p>No te cobramos nada. Pod\u00e9s intentar de nuevo con otro medio de pago.<\/p><p><a class=\"btn-sec\" href=\"/\">Intentar de nuevo<\/a><\/p>`,\n    revisar_pago: `<div class=\"icono-grande\">\ud83d\udd0e<\/div><h2>Estamos revisando tu pago<\/h2><p>Acercate al mostrador con tu comprobante, por favor.<\/p>`,\n    pagado: `<div class=\"icono-grande ok\">\u2705<\/div><p>\u00a1Pago confirmado! Tu pedido<\/p><div class=\"numero\">#${num}<\/div><h2>ya est\u00e1 en cocina \ud83d\udc69\u200d\ud83c\udf73<\/h2>${barra}`,\n    en_preparacion: `<div class=\"icono-grande ok\">\ud83d\udc69\u200d\ud83c\udf73<\/div><p>Pedido<\/p><div class=\"numero\">#${num}<\/div><h2>Lo estamos preparando<\/h2>${barra}`,\n    listo: `<div class=\"icono-grande ok\">\ud83c\udf89<\/div><p>Pedido<\/p><div class=\"numero\">#${num}<\/div><h2>${takeaway ? '\u00a1Listo! Pas\u00e1 a retirarlo por el mostrador' : '\u00a1Listo! Ya va a tu mesa'}<\/h2>${barra}`,\n    entregado: `<div class=\"icono-grande ok\">\ud83d\udc9a<\/div><div class=\"numero\">#${num}<\/div><h2>\u00a1Que lo disfrutes!<\/h2><p>Gracias por elegir Garden Caf\u00e9.<\/p>${barra}`,\n  };\n  t.innerHTML = vistas[p.estado] || vistas.pendiente_pago;\n  if (p.estado === 'listo' && navigator.vibrate) navigator.vibrate([200, 100, 200]);\n\n  if (p.items) {\n    det.hidden = false;\n    det.innerHTML = `<h3 style=\"margin-top:0\">${takeaway ? '\ud83d\udecd\ufe0f Take away \u00b7 ' + esc(p.hora_retiro) : '\ud83c\udf7d\ufe0f Mesa ' + p.mesa} \u00b7 ${esc(p.nombre)}<\/h3>\n      <div class=\"resumen\">${p.items.map((l) => `<div class=\"linea\"><span>${l.qty} \u00d7 ${esc(l.nombre)}<\/span><span>${fmt(l.subtotal)}<\/span><\/div>`).join('')}\n      <div class=\"linea total\"><span>Total<\/span><span>${fmt(p.total)}<\/span><\/div><\/div>\n      ${p.notas ? `<p>\ud83d\udcdd ${esc(p.notas)}<\/p>` : ''}`;\n  }\n  if (['pagado', 'en_preparacion', 'listo', 'entregado'].includes(p.estado)) {\n    try { localStorage.removeItem('gc_carrito'); } catch {}\n  }\n}\n\nconsultar(true);\nsetInterval(() => { if (ultimoEstado !== 'entregado' && ultimoEstado !== 'rechazado') consultar(false); }, 4000);\n<\/script>\n<\/body>\n<\/html>\n", "public/index.html": "<!doctype html>\n<html lang=\"es-AR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <meta name=\"theme-color\" content=\"#1f3a2c\">\n  <title>Garden Caf\u00e9 \u00b7 Carta<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css\">\n<\/head>\n<body>\n  <header class=\"hero\">\n    <div class=\"contenedor\">\n      <h1 id=\"nombre-negocio\">Garden Caf\u00e9<\/h1>\n      <p id=\"slogan\"><\/p>\n      <div class=\"meta\">\n        <span class=\"chip destacado\" id=\"chip-modo\" hidden><\/span>\n        <span class=\"chip\" id=\"chip-horario\"><\/span>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <nav class=\"tabs\"><div class=\"contenedor\" id=\"tabs\"><\/div><\/nav>\n\n  <main class=\"contenedor\" id=\"carta\"><div class=\"spinner\"><\/div><\/main>\n\n  <footer class=\"pie contenedor\" id=\"pie\"><\/footer>\n\n  <div class=\"barra\" id=\"barra\">\n    <button class=\"btn-principal\" id=\"btn-carrito\">\n      <span><span class=\"cuenta\" id=\"cant-items\">0<\/span>&nbsp; Hacer mi pedido<\/span>\n      <span id=\"total-barra\">$0<\/span>\n    <\/button>\n  <\/div>\n\n  <!-- Bot de pedido -->\n  <div class=\"bot\" id=\"bot\" aria-hidden=\"true\">\n    <div class=\"bot-head\">\n      <div class=\"avatar\">\ud83c\udf3f<\/div>\n      <div><b>Garden Bot<\/b><small>Te ayudo con tu pedido<\/small><\/div>\n      <button class=\"cerrar\" id=\"cerrar-bot\">\u2190 Carta<\/button>\n    <\/div>\n    <div class=\"chat\" id=\"chat\"><\/div>\n    <div class=\"opciones\" id=\"opciones\"><\/div>\n  <\/div>\n\n  <script src=\"/app.js\"><\/script>\n<\/body>\n<\/html>\n", "public/pago-simulado.html": "<!doctype html>\n<html lang=\"es-AR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Pago de prueba<\/title>\n  <link rel=\"stylesheet\" href=\"/styles.css\">\n  <style>body{background:#eef6fb}.hero{background:#009ee3}<\/style>\n<\/head>\n<body>\n  <header class=\"hero\"><div class=\"contenedor\"><h1>Pago de prueba<\/h1><p>El sistema est\u00e1 en MODO PRUEBA: no se cobra dinero real.<\/p><\/div><\/header>\n  <main class=\"contenedor\">\n    <div class=\"tarjeta centro\">\n      <p>Total a pagar<\/p>\n      <div class=\"numero\" id=\"total\">\u2026<\/div>\n      <p style=\"color:#6b7069\">En producci\u00f3n, ac\u00e1 se abre el checkout oficial de Mercado Pago.<\/p>\n      <p><button class=\"btn-mp\" id=\"aprobar\">Simular pago APROBADO<\/button><\/p>\n      <p><button class=\"btn-sec\" id=\"rechazar\">Simular pago rechazado<\/button><\/p>\n    <\/div>\n  <\/main>\n<script>\nconst id = new URLSearchParams(location.search).get('pedido');\nfetch('/api/pedidos/' + id).then((r) => r.json()).then((p) => { document.getElementById('total').textContent = '$' + p.total.toLocaleString('es-AR'); });\nasync function pagar(resultado) {\n  await fetch('/api/simular-pago/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ resultado }) });\n  location.href = '/estado?pedido=' + id;\n}\ndocument.getElementById('aprobar').onclick = () => pagar('aprobado');\ndocument.getElementById('rechazar').onclick = () => pagar('rechazado');\n<\/script>\n<\/body>\n<\/html>\n", "public/panel.html": "<!doctype html>\n<html lang=\"es-AR\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"theme-color\" content=\"#1f3a2c\">\n  <title>Garden Caf\u00e9 \u00b7 Panel de pedidos<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"/styles.css\">\n  <style>\n    body { background: #eef0ea; }\n    .top { background: var(--verde); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; z-index: 3; }\n    .top h1 { margin: 0; font-size: 22px; }\n    .kpi { background: rgba(255,255,255,.12); border-radius: 10px; padding: 6px 12px; font-size: 13px; }\n    .kpi b { font-size: 16px; display: block; }\n    .top .der { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n    .top a, .top label { color: #fff; font-size: 14px; }\n    .top a { background: rgba(255,255,255,.14); padding: 8px 12px; border-radius: 10px; text-decoration: none; }\n    .conexion { width: 10px; height: 10px; border-radius: 50%; background: #e0a800; display: inline-block; }\n    .conexion.on { background: #5bd48a; }\n    .tablero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 14px; }\n    @media (max-width: 900px) { .tablero { grid-template-columns: 1fr; } }\n    .col h2 { font-size: 18px; margin: 4px 4px 10px; display: flex; justify-content: space-between; }\n    .col h2 span { font-family: Inter, sans-serif; font-size: 14px; background: #fff; border-radius: 999px; padding: 2px 10px; }\n    .ped { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); border-left: 6px solid var(--hoja); }\n    .ped.takeaway { border-left-color: var(--acento); }\n    .ped.nuevo { animation: destello 1s ease 3; }\n    .ped.alerta { border-left-color: #b3261e; background: #fff4f2; }\n    @keyframes destello { 50% { box-shadow: 0 0 0 4px #ffd166; } }\n    .ped .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }\n    .ped .num { font-family: Fraunces, serif; font-size: 28px; color: var(--verde); }\n    .ped .dest { font-weight: 700; font-size: 17px; }\n    .ped .quien { color: var(--gris); font-size: 14px; margin: 2px 0 8px; }\n    .ped ul { margin: 0; padding-left: 0; list-style: none; font-size: 16px; }\n    .ped li { padding: 3px 0; }\n    .ped li b { display: inline-block; min-width: 28px; }\n    .ped .nota { background: #fff7d6; border-radius: 8px; padding: 6px 10px; margin-top: 8px; font-size: 14px; }\n    .ped .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }\n    .ped .tiempo { font-size: 13px; color: var(--gris); }\n    .ped .acc { display: flex; gap: 6px; }\n    .ped button { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; background: var(--verde); color: #fff; }\n    .ped button.sec { background: #e9e4d7; color: var(--verde); }\n    .vacio { color: var(--gris); text-align: center; padding: 20px; font-size: 14px; }\n    .login { max-width: 360px; margin: 12vh auto; padding: 0 16px; }\n    .login input { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--linea); font-size: 16px; margin: 10px 0; }\n    #ticket-frame { position: absolute; width: 0; height: 0; border: 0; }\n  <\/style>\n<\/head>\n<body>\n  <div id=\"vista-login\" class=\"login\" hidden>\n    <div class=\"tarjeta\">\n      <h2 style=\"margin-top:0\">Panel de pedidos<\/h2>\n      <p>Ingres\u00e1 la contrase\u00f1a del local.<\/p>\n      <form id=\"form-login\">\n        <input type=\"password\" id=\"pass\" placeholder=\"Contrase\u00f1a\" autocomplete=\"current-password\">\n        <button class=\"btn-principal\" style=\"justify-content:center\">Entrar<\/button>\n        <p class=\"error\" id=\"err-login\"><\/p>\n      <\/form>\n    <\/div>\n  <\/div>\n\n  <div id=\"vista-panel\" hidden>\n    <div class=\"top\">\n      <h1>Garden Caf\u00e9<\/h1>\n      <span class=\"conexion\" id=\"conexion\" title=\"Conexi\u00f3n en vivo\"><\/span>\n      <div class=\"kpi\"><b id=\"k-ped\">0<\/b>pedidos hoy<\/div>\n      <div class=\"kpi\"><b id=\"k-total\">$0<\/b>cobrado hoy<\/div>\n      <div class=\"kpi\"><b id=\"k-mix\">0 / 0<\/b>mesa / take away<\/div>\n      <div class=\"der\">\n        <label><input type=\"checkbox\" id=\"auto-print\"> Imprimir comanda autom\u00e1ticamente<\/label>\n        <a href=\"#\" id=\"btn-sonido\">\ud83d\udd14 Probar sonido<\/a>\n        <a href=\"/qr\">\ud83d\udd33 QR de mesas<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"tablero\">\n      <div class=\"col\"><h2>\ud83c\udd95 Nuevos <span id=\"c-nuevos\">0<\/span><\/h2><div id=\"l-nuevos\"><\/div><\/div>\n      <div class=\"col\"><h2>\ud83d\udc69\u200d\ud83c\udf73 En preparaci\u00f3n <span id=\"c-prep\">0<\/span><\/h2><div id=\"l-prep\"><\/div><\/div>\n      <div class=\"col\"><h2>\u2705 Listos <span id=\"c-listos\">0<\/span><\/h2><div id=\"l-listos\"><\/div><\/div>\n    <\/div>\n  <\/div>\n  <iframe id=\"ticket-frame\" title=\"ticket\"><\/iframe>\n\n<script>\nconst fmt = (n) => '$' + Math.round(n).toLocaleString('es-AR');\nconst esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };\nconst pedidos = new Map();\nconst recienLlegados = new Set();\nconst autoPrint = document.getElementById('auto-print');\ntry { autoPrint.checked = localStorage.getItem('gc_autoprint') === '1'; } catch {}\nautoPrint.onchange = () => { try { localStorage.setItem('gc_autoprint', autoPrint.checked ? '1' : '0'); } catch {} };\n\n// ---------- Sonido ----------\nlet audio;\nfunction sonar() {\n  try {\n    audio = audio || new (window.AudioContext || window.webkitAudioContext)();\n    [0, 0.25, 0.5].forEach((t, i) => {\n      const o = audio.createOscillator(), g = audio.createGain();\n      o.frequency.value = i === 2 ? 1175 : 880;\n      g.gain.setValueAtTime(0.0001, audio.currentTime + t);\n      g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + t + 0.02);\n      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.22);\n      o.connect(g).connect(audio.destination);\n      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.25);\n    });\n  } catch {}\n}\ndocument.getElementById('btn-sonido').onclick = (e) => { e.preventDefault(); sonar(); };\n\n// ---------- Login ----------\nasync function iniciar() {\n  const s = await fetch('/api/panel/sesion').then((r) => r.json());\n  if (!s.ok) { document.getElementById('vista-login').hidden = false; return; }\n  document.getElementById('vista-panel').hidden = false;\n  await cargar();\n  conectar();\n  resumen();\n  setInterval(resumen, 30000);\n  setInterval(render, 30000); // refresca \"hace X min\"\n}\ndocument.getElementById('form-login').onsubmit = async (e) => {\n  e.preventDefault();\n  sonar(); // habilita el audio con la interacci\u00f3n del usuario\n  const r = await fetch('/api/panel/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pass').value }) });\n  if (!r.ok) { document.getElementById('err-login').textContent = 'Contrase\u00f1a incorrecta'; return; }\n  document.getElementById('vista-login').hidden = true;\n  iniciar();\n};\n\nasync function cargar() {\n  const lista = await fetch('/api/panel/pedidos').then((r) => r.json());\n  lista.forEach((p) => pedidos.set(p.id, p));\n  render();\n}\nasync function resumen() {\n  const r = await fetch('/api/panel/resumen').then((r) => r.json()).catch(() => null);\n  if (!r) return;\n  document.getElementById('k-ped').textContent = r.pedidos;\n  document.getElementById('k-total').textContent = fmt(r.total);\n  document.getElementById('k-mix').textContent = `${r.mesa} / ${r.takeaway}`;\n}\n\n// ---------- Tiempo real ----------\nfunction conectar() {\n  const es = new EventSource('/api/panel/stream');\n  const luz = document.getElementById('conexion');\n  es.onopen = () => { luz.classList.add('on'); cargar(); };\n  es.onerror = () => luz.classList.remove('on');\n  es.addEventListener('pedido', (ev) => {\n    const p = JSON.parse(ev.data);\n    const antes = pedidos.get(p.id);\n    pedidos.set(p.id, p);\n    if (!antes && (p.estado === 'pagado' || p.estado === 'revisar_pago')) {\n      recienLlegados.add(p.id);\n      sonar();\n      if (p.estado === 'pagado' && autoPrint.checked) imprimir(p.id);\n      setTimeout(() => recienLlegados.delete(p.id), 4000);\n      resumen();\n    }\n    render();\n  });\n}\n\n// ---------- Render ----------\nfunction hace(iso) {\n  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);\n  return m < 1 ? 'reci\u00e9n' : `hace ${m} min`;\n}\nfunction tarjeta(p) {\n  const ta = p.modo === 'takeaway';\n  const alerta = p.estado === 'revisar_pago';\n  const acciones = {\n    pagado: `<button class=\"sec\" data-print>\ud83d\udda8\ufe0f<\/button><button data-e=\"en_preparacion\">Preparar<\/button>`,\n    en_preparacion: `<button class=\"sec\" data-print>\ud83d\udda8\ufe0f<\/button><button data-e=\"listo\">Listo \u2713<\/button>`,\n    listo: `<button data-e=\"entregado\">${ta ? 'Retirado' : 'Entregado'}<\/button>`,\n    revisar_pago: `<button data-e=\"en_preparacion\" title=\"Solo si verificaste el pago ${esc(p.pago_id)} en tu cuenta de Mercado Pago\">Lo verifiqu\u00e9, preparar<\/button>`,\n  }[p.estado] || '';\n  return `<div class=\"ped ${ta ? 'takeaway' : ''} ${alerta ? 'alerta' : ''} ${recienLlegados.has(p.id) ? 'nuevo' : ''}\" data-id=\"${p.id}\">\n    <div class=\"cab\"><span class=\"dest\">${ta ? '\ud83d\udecd\ufe0f TAKE AWAY' : '\ud83c\udf7d\ufe0f MESA ' + p.mesa}<\/span><span class=\"num\">${p.numero ? '#' + String(p.numero).padStart(3, '0') : '\u26a0\ufe0f'}<\/span><\/div>\n    <div class=\"quien\">${esc(p.nombre)}${ta ? ` \u00b7 \ud83d\udcf1 ${esc(p.telefono)} \u00b7 \u23f0 ${esc(p.hora_retiro)}` : ''}${alerta ? ` \u00b7 \u26a0\ufe0f El monto pagado no coincide: revis\u00e1 el pago ${esc(p.pago_id)} en Mercado Pago` : ''}
